name: Release npm package

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA of the landed source commit to verify and release
        required: true
        type: string
      package:
        description: Exact workspace package to release
        required: true
        type: choice
        # @lenso/cli needs a separate four-platform native binary packaging gate.
        options:
          - lenso-bun
          - lenso-bun-plugin
          - lenso-contract-runtime
          - lenso-http-egress-workers
          - lenso-process-protocol
          - lenso-web-client
          - lenso-web-ingress-workers
          - lenso-workers-runtime
      version:
        description: Exact reviewed package version
        required: true
        type: string
      mode:
        description: Read-only by default; publish requires separate authorization
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish]
      publish_confirmation:
        description: Enter publish only when mode is publish
        required: false
        default: ''
        type: string
      reviewed_archive_sha256:
        description: SHA-256 from the reviewed dry run; required for publish
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: npm-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Verify npm release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      PACKAGE_PATH: packages/${{ inputs.package }}
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_CONFIRMATION: ${{ inputs.publish_confirmation }}
      REVIEWED_SHA256: ${{ inputs.reviewed_archive_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Verify exact version and landed source
        run: |
          test "$RELEASE_MODE" = dry-run || test "$RELEASE_MODE" = publish
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$RELEASE_MODE" == publish ]]; then
            test "$RELEASE_CONFIRMATION" = publish
            [[ "$REVIEWED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          node --input-type=module -e '
            import fs from "node:fs";
            const names = {
              "packages/lenso-bun": "@lenso/bun",
              "packages/lenso-bun-plugin": "@lenso/bun-plugin",
              "packages/lenso-contract-runtime": "@lenso/contract-runtime",
              "packages/lenso-http-egress-workers": "@lenso/http-egress-workers",
              "packages/lenso-process-protocol": "@lenso/process-protocol",
              "packages/lenso-web-client": "@lenso/web-client",
              "packages/lenso-web-ingress-workers": "@lenso/web-ingress-workers",
              "packages/lenso-workers-runtime": "@lenso/workers-runtime",
            };
            const path = process.env.PACKAGE_PATH;
            const manifest = JSON.parse(fs.readFileSync(path + "/package.json"));
            if (manifest.name !== names[path] || manifest.version !== process.env.RELEASE_VERSION || manifest.private) process.exit(1);
          '
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify workspace and package
        run: |
          bun run build
          bun run typecheck
          bun run test:typescript
          bun run test:workers
          bun run package-smoke
          git diff --exit-code
      - name: Pack reviewed artifact
        id: pack
        run: |
          mkdir release-artifacts
          npm pack "./$PACKAGE_PATH" --pack-destination release-artifacts
          shopt -s nullglob
          archives=(release-artifacts/*.tgz)
          test "${#archives[@]}" -eq 1
          sha256sum "${archives[0]}"
          echo "sha256=$(sha256sum "${archives[0]}" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Verify npm artifact resolution
        run: npm publish ./release-artifacts/*.tgz --dry-run --ignore-scripts --access public --provenance=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: release-artifacts/*.tgz
          if-no-files-found: error

  publish:
    if: ${{ inputs.mode == 'publish' && inputs.publish_confirmation == 'publish' }}
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: release-artifacts
      - name: Verify reviewed archive bytes
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.archive_sha256 }}
          REVIEWED_SHA256: ${{ inputs.reviewed_archive_sha256 }}
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$REVIEWED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$EXPECTED_SHA256" = "$REVIEWED_SHA256"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          shopt -s nullglob
          archives=(release-artifacts/*.tgz)
          test "${#archives[@]}" -eq 1
          test "$(sha256sum "${archives[0]}" | cut -d ' ' -f1)" = "$EXPECTED_SHA256"
      - name: Check exact public npm version is unoccupied
        env:
          PACKAGE_PATH: packages/${{ inputs.package }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          package_name="$(node -p "require('./$PACKAGE_PATH/package.json').name")"
          node .github/scripts/check-npm-release-version.mjs "$package_name" "$RELEASE_VERSION"
      - name: Publish verified artifact
        run: npm publish ./release-artifacts/*.tgz --ignore-scripts --access public --provenance --registry=https://registry.npmjs.org/
