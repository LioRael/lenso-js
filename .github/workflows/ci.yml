name: CI

on:
  pull_request:
  push:
    branches: [main, "candidate/**"]

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.94.0"
      - run: bun install --frozen-lockfile
      - run: cargo install lenso-contract-codegen --version 0.9.0 --locked
      - run: bun run --filter '@lenso/bun' capabilities:check
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test:typescript
      - run: bun run package-smoke
      - run: npm pack --dry-run ./packages/lenso-bun
      - run: npm pack --dry-run ./packages/lenso-bun-plugin
      - run: npm pack --dry-run ./packages/lenso-web-client
      - name: Build representative Bun fixtures
        run: |
          bun build --target bun fixtures/bun/sdk-request-provider.ts --outdir /tmp/lenso-bun-fixtures
          bun build --target bun fixtures/bun/request-provider.ts --outdir /tmp/lenso-bun-fixtures
          bun build --target bun fixtures/bun/request-consumer.ts --outdir /tmp/lenso-bun-fixtures
      - name: Run wire benchmark smoke
        env:
          LENSO_BUN_BENCHMARK_REQUESTS: 5
        run: |
          bun fixtures/bun/wire-benchmark.ts --output /tmp/lenso-bun-wire-smoke.json
          bun -e 'const value = await Bun.file("/tmp/lenso-bun-wire-smoke.json").json(); if (value.schema !== "lenso.bun-wire-benchmark.v1" || value.candidates?.["json-rpc-http"]?.request_count !== 5) process.exit(1)'
