name: CI

on:
  pull_request:
  push:
    branches: ["candidate/**"]
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.94.0"
      - run: bun install --frozen-lockfile
      - run: cargo install lenso-contract-codegen --version 0.10.0 --locked
      - run: bun run --filter '@lenso/bun' capabilities:check
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test:typescript
      - run: bun run test:workers
      - name: Qualify source-first Request and Stream in real workerd
        run: |
          npm ci --ignore-scripts --prefix fixtures/source-first-request/tooling
          bun fixtures/source-first-request/build.ts
          python3 fixtures/source-first-request/run.py --workerd fixtures/source-first-request/tooling/node_modules/@cloudflare/workerd-linux-64/bin/workerd --output /tmp/lenso-source-first-workerd.json
          bun fixtures/source-first-stream/build.ts
          python3 fixtures/source-first-stream/run.py --workerd fixtures/source-first-request/tooling/node_modules/@cloudflare/workerd-linux-64/bin/workerd --output /tmp/lenso-source-first-stream-workerd.json
      - name: Run isolated packed facility consumer
        run: node fixtures/workers-http-parity/packed-facilities.mjs /tmp/lenso-packed-facilities.json
      - name: Run isolated packed authoring consumer
        run: node fixtures/source-first-request/packed-authoring.mjs /tmp/lenso-packed-authoring.json
      - run: bun run package-smoke
      - run: npm pack --dry-run ./packages/lenso-bun
      - run: npm pack --dry-run ./packages/lenso-bun-plugin
      - run: npm pack --dry-run ./packages/lenso-contract-runtime
      - run: npm pack --dry-run ./packages/lenso-http-egress-workers
      - run: npm pack --dry-run ./packages/lenso-process-protocol
      - run: npm pack --dry-run ./packages/lenso-web-client
      - run: npm pack --dry-run ./packages/lenso-web-ingress-workers
      - run: npm pack --dry-run ./packages/lenso-workers-runtime
      - name: Build representative Bun fixtures
        run: |
          bun build --target bun fixtures/bun/sdk-request-provider.ts --outdir /tmp/lenso-bun-fixtures
          bun build --target bun fixtures/bun/request-provider.ts --outdir /tmp/lenso-bun-fixtures
          bun build --target bun fixtures/bun/request-consumer.ts --outdir /tmp/lenso-bun-fixtures
      - name: Run wire benchmark smoke
        env:
          LENSO_BUN_BENCHMARK_REQUESTS: 5
        run: |
          bun fixtures/bun/wire-benchmark.ts --output /tmp/lenso-bun-wire-smoke.json
          bun -e 'const value = await Bun.file("/tmp/lenso-bun-wire-smoke.json").json(); if (value.schema !== "lenso.bun-wire-benchmark.v1" || value.candidates?.["json-rpc-http"]?.request_count !== 5) process.exit(1)'
